log4j.rootCategory=DEBUG, Console

log4j.logger.one.nio.http.HttpServerTest=TRACE, Console
log4j.additivity.one.nio.http.HttpServerTest=false

log4j.appender.Console=org.apache.log4j.ConsoleAppender
log4j.appender.Console.layout=org.apache.log4j.PatternLayout
log4j.appender.Console.layout.ConversionPattern=%d{ABSOLUTE} %C %m %n



